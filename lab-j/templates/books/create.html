{% extends 'layout.html' %}
{% block content %}
<h1>Dodaj książkę</h1>
<form action="{{ url_for('create') }}" method="POST" class="edit-form">
    <div class="form-group">
        <label>Tytuł: <input type="text" name="title" required></label>
    </div>
    <div class="form-group">
        <label>Autor: <input type="text" name="author" required></label>
    </div>
    <div class="form-group">
        <label>Rok: <input type="number" name="year" required></label>
    </div>
    <input type="submit" value="Zapisz książkę">
</form>
<a href="{{ url_for('index') }}">Powrót do listy</a>
{% endblock %}
