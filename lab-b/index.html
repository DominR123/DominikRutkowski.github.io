<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Imie Nazwisko (00000) - PTW LAB B</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
<div class="todo-app">
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Wyszukiwarka..." class="search-input">
    </div>
    <div class="todo-list">
        <!-- Lista zadań generowana dynamicznie przez JS -->
        <div class="todo-add">
            <input type="text" placeholder="Dodaj zadanie..." minlength="3" maxlength="255">
            <input type="date" placeholder="Termin...">
            <button class="add-button">Dodaj</button>
        </div>
    </div>
</div>
</body>
</html>
